name: Release

# Déclenché quand tu pousses un tag de version (ex: v3.1.0),
# ou manuellement depuis l'onglet Actions.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la GitHub Release et y attacher les artefacts

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    env:
      # Clé privée de signature Chrome (contenu du .pem). Si absente, l'étape
      # de packaging .crx est simplement ignorée (le .zip Chrome reste produit).
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      # Identifiants OAuth2 pour l'API Chrome Web Store. Si absents, l'étape
      # d'upload est simplement ignorée (le .zip reste à déposer manuellement).
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      # URL du webhook n8n (prod) à notifier en fin de release.
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # La version du tag (v3.2.0 -> 3.2.0) devient la source de vérité :
      # on l'écrit dans package.json, d'où elle se propage aux manifests
      # (via scripts/update-manifest-version.js) puis aux noms de fichiers.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Signe l'extension via l'API AMO et récupère le .xpi signé dans releases/firefox/.
      # La revue AMO peut parfois dépasser le timeout de web-ext (le fichier reste
      # alors téléchargeable depuis l'URL loggée) : on n'échoue pas le release pour
      # autant, le .zip/.crx Chrome et la GitHub Release doivent quand même sortir.
      - name: Build & sign Firefox (unlisted)
        id: sign-firefox
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: npm run sign:firefox

      - name: Warn if Firefox signing timed out
        if: steps.sign-firefox.outcome == 'failure'
        run: |
          echo "::warning::Firefox signing did not complete before the timeout. Check the AMO developer page and download/attach the signed .xpi manually once it's approved."

      # Construit le .zip Chrome
      - name: Build Chrome zip
        run: npm run bundle:chrome

      # Envoie le .zip au Chrome Web Store en tant que brouillon (draft).
      - name: Upload to Chrome Web Store
        id: chrome-upload
        if: startsWith(github.ref, 'refs/tags/') && env.CHROME_CLIENT_ID != ''
        # Un échec ici (ex: refresh token expiré) ne doit pas empêcher le
        # packaging du .crx ni l'attache des assets à la GitHub Release.
        continue-on-error: true
        env:
          # v4 de chrome-webstore-upload-cli n'accepte plus --client-id /
          # --client-secret / --refresh-token, seulement ces variables d'env.
          CLIENT_ID: ${{ env.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ env.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ env.CHROME_REFRESH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx chrome-webstore-upload-cli upload \
            --source "releases/chrome/shotgridrodeofx-chrome-v${VERSION}.zip" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --publisher-id "$CHROME_PUBLISHER_ID"

      - name: Warn if Chrome upload was skipped
        if: steps.chrome-upload.outcome == 'failure'
        run: |
          echo "::warning::Chrome upload failed — most likely a previous submission is still under Google review (an item can't be edited/published while 'in review'). Wait for that review to finish, then re-run this workflow to upload v$(node -p "require('./package.json').version")."

      # Publie automatiquement la version qui vient d'être uploadée — passe
      # de "brouillon" à "en cours de revue" auprès de Google, puis public
      # à 100% une fois la revue passée. Ignoré si l'upload a échoué (rien
      # de neuf à publier) ou si les identifiants Chrome sont absents.
      - name: Publish to Chrome Web Store
        if: >-
          startsWith(github.ref, 'refs/tags/') && env.CHROME_CLIENT_ID != ''
          && steps.chrome-upload.outcome == 'success'
        continue-on-error: true
        env:
          CLIENT_ID: ${{ env.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ env.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ env.CHROME_REFRESH_TOKEN }}
        run: |
          npx chrome-webstore-upload-cli publish \
            --extension-id "$CHROME_EXTENSION_ID" \
            --publisher-id "$CHROME_PUBLISHER_ID"

      # Installe Chrome pour pouvoir empaqueter/signer le .crx
      - name: Setup Chrome
        if: env.CRX_PRIVATE_KEY != ''
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      # Empaquette le dossier public/ en .crx signé avec la clé privée
      - name: Pack Chrome .crx
        if: env.CRX_PRIVATE_KEY != ''
        run: |
          echo "$CRX_PRIVATE_KEY" > chrome-key.pem
          VERSION=$(node -p "require('./package.json').version")
          "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --pack-extension="$PWD/public" \
            --pack-extension-key="$PWD/chrome-key.pem" \
            --no-sandbox --disable-gpu
          mv public.crx "releases/chrome/shotgridrodeofx-chrome-v${VERSION}.crx"
          rm -f chrome-key.pem

      # Artefacts téléchargeables sur chaque run (utile pour les lancements manuels)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            releases/firefox/*.xpi
            releases/chrome/*.zip
            releases/chrome/*.crx
          if-no-files-found: error

      # Sur un tag: crée/actualise la GitHub Release et y attache les binaires
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/firefox/*.xpi
            releases/chrome/*.zip
            releases/chrome/*.crx

      # Notifie n8n par simple GET. On ignore la réponse et les erreurs:
      # un webhook indisponible ne doit pas faire échouer le release.
      - name: Notify n8n
        if: always() && env.N8N_WEBHOOK_URL != ''
        run: curl -s -o /dev/null "$N8N_WEBHOOK_URL" || true
