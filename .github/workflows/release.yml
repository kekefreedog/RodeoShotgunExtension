name: Release

# Déclenché quand tu pousses un tag de version (ex: v3.1.0),
# ou manuellement depuis l'onglet Actions.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la GitHub Release et y attacher les artefacts

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    env:
      # Clé privée de signature Chrome (contenu du .pem). Si absente, l'étape
      # de packaging .crx est simplement ignorée (le .zip Chrome reste produit).
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Signe l'extension via l'API AMO et récupère le .xpi signé dans releases/firefox/
      - name: Build & sign Firefox (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: npm run sign:firefox

      # Construit le .zip Chrome (le dépôt au Chrome Web Store reste manuel)
      - name: Build Chrome zip
        run: npm run bundle:chrome

      # Installe Chrome pour pouvoir empaqueter/signer le .crx
      - name: Setup Chrome
        if: env.CRX_PRIVATE_KEY != ''
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      # Empaquette le dossier public/ en .crx signé avec la clé privée
      - name: Pack Chrome .crx
        if: env.CRX_PRIVATE_KEY != ''
        run: |
          echo "$CRX_PRIVATE_KEY" > chrome-key.pem
          VERSION=$(node -p "require('./package.json').version")
          "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --pack-extension="$PWD/public" \
            --pack-extension-key="$PWD/chrome-key.pem" \
            --no-sandbox --disable-gpu
          mv public.crx "releases/chrome/shotgridrodeofx-chrome-v${VERSION}.crx"
          rm -f chrome-key.pem

      # Artefacts téléchargeables sur chaque run (utile pour les lancements manuels)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            releases/firefox/*.xpi
            releases/chrome/*.zip
            releases/chrome/*.crx
          if-no-files-found: error

      # Sur un tag: crée/actualise la GitHub Release et y attache les binaires
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/firefox/*.xpi
            releases/chrome/*.zip
            releases/chrome/*.crx
