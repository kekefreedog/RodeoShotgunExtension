name: Test

# Vérifie que l'extension compile (typecheck + builds) à chaque PR et push sur main.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (popup + content + background)
        run: |
          npx vite build
          npx vite build --config vite.content.config.ts
          npx vite build --config vite.chrome.config.ts
